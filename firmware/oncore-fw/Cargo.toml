[package]
name = "oncore-fw"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
cortex-m = { version = "0.7.10", features = ["critical-section-single-core", "inline-asm"] }
cortex-m-rt = "0.7.7"
defmt = { version = "1.2.0", optional = true }
defmt-rtt = { version = "1.3.1", optional = true }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-stm32 = { version = "0.6.0", features = ["stm32c091fc", "time-driver-any", "memory-x", "exti", "unstable-pac"] }
embassy-time = "0.5.1"
embedded-io-async = "0.7.0"
oncore-app = { version = "0.1.0", path = "../oncore-app" }
oncore-core = { version = "0.1.0", path = "../oncore-core" }
panic-halt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"], optional = true }
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
static_cell = "2.1.1"

[features]
default = ["rtt"]
# On a NUCLEO-C092RC: USART1 on the LQFP64's own PA9 and PA10, not
# remapped from PA11 and PA12 (src/main.rs).
nucleo = []
# The UT Plus Oncore (R5122U1152, software 3.1) in place of the VP, for
# the 58503B's and Z3816A's UT Plus path (PLAN.md).
ut-plus = []
# The six-channel VP alone (B1121P1114): the first @@Ea does not make it
# eight, so a 58503A, 58503B or Z3816A meets a six-channel engine.
vp-six = []
# The Z3817A: the eight-channel VP powered up as a 58503A leaves its
# engine (@@Ea, @@Bb, Time RAIM, fixing; smartclock-gps's
# CONFIGURATION_58503A) and deaf, as the Z3817A cannot command its
# receiver.
z3817a = []
# Events and panics over RTT for a debug probe (defmt).  Without it the
# firmware logs nothing and halts on a panic: the production build,
# `--no-default-features`.
rtt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
    "embassy-executor/defmt",
    "embassy-stm32/defmt",
    "embassy-time/defmt",
]

# The workspace's lints (../Cargo.toml's `[workspace.lints]`, the stack's
# thresholds in ../clippy.toml), copied: this crate is its own workspace,
# so it cannot inherit them.  Keep the two the same.
[lints.rust]
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_code = "deny"

[lints.clippy]
# A function's constants and items at its top, before its statements.
items_after_statements = "warn"
doc_markdown = "warn"
enum_glob_use = "deny"
# Nothing large on the stack (clippy.toml's thresholds).
large_stack_arrays = "deny"
large_types_passed_by_value = "deny"
large_const_arrays = "deny"

# Optimize for size.  Debug info stays on the host.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"

[profile.dev]
opt-level = "s"

[dev-dependencies]
smartclock-gps = { git = "https://github.com/charlieh0tel/smartclock", tag = "v1.9.1" }
smartclock-gps-ublox = { git = "https://github.com/charlieh0tel/smartclock", tag = "v1.9.1" }
smartclock-ubx = { git = "https://github.com/charlieh0tel/smartclock", tag = "v1.9.1" }

[build-dependencies]
smartclock-gps-ublox = { git = "https://github.com/charlieh0tel/smartclock", tag = "v1.9.1", version = "1.9.1" }
smartclock-ubx = { git = "https://github.com/charlieh0tel/smartclock", tag = "v1.9.1", version = "1.9.1" }

