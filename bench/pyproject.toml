[project]
name = "oncore-emulator-bench"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "pyvisa>=1.16.2",
    "pyvisa-py>=0.8.1",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest>=8",
    "ruff==0.17.0",
    "types-pyserial>=3.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ANN", "RUF"]

[tool.mypy]
strict = true
